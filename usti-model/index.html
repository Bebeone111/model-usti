<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Ústí — centrum</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <h1 id="title">Model Ústí — centrum</h1>
      <p id="hint">WASD — chůze · Shift — rychlý přesun · myš — rozhlížení · kliknutí zamkne kurzor · Esc — uvolnit</p>
      <p id="status">Načítám data…</p>
    </div>
    <p id="credit">© přispěvatelé OpenStreetMap (ODbL) · ortofoto a DMR 5G © ČÚZK (CC BY 4.0)</p>
    <div id="touch">
      <div id="stick-wrap">
        <span id="stick-label">Chůze</span>
        <div id="stick"><div id="stick-knob"></div></div>
      </div>
      <div id="speed">
        <span id="speed-value">3,6 m/s</span>
        <input id="speed-range" type="range" min="1" max="16" step="0.1" value="3.6" />
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
